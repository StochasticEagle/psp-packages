name: Publish packages

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: psp-packages-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Verify GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          error_file="$RUNNER_TEMP/pages-error.txt"
          if ! pages_json="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>"$error_file")"; then
            echo "::error::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}. Enable Pages and select GitHub Actions as the build source before publishing."
            cat "$error_file" >&2
            exit 1
          fi

          build_type="$(jq -r '.build_type // ""' <<<"$pages_json")"
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::GitHub Pages is enabled but is not configured to build from GitHub Actions (build_type='$build_type')."
            exit 1
          fi

      - name: Select successful Packages run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?branch=${GITHUB_REF_NAME}&status=success&per_page=100" --jq '.workflow_runs[] | select(.name == "Packages" and .conclusion == "success") | .id' | head -n 1)"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful Packages workflow run exists for branch ${GITHUB_REF_NAME}."
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          head_branch="$(jq -r '.head_branch // ""' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha // ""' <<<"$run_json")"
          run_number="$(jq -r '.run_number' <<<"$run_json")"

          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "packages" and .expired == false) | .id' | head -n 1)"
          if [[ -z "$artifact_id" ]]; then
            echo "::error::Successful Packages run ${run_id} has no non-expired 'packages' artifact."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "Using Packages #${run_number} from ${head_branch} at ${head_sha} (artifact ${artifact_id})."

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run_id }}

      - name: Verify downloaded package set
        run: |
          count="$(find packages -maxdepth 1 -type f -name '*.pkg.tar.*' | wc -l)"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::Downloaded Packages artifact contains no package archives."
            exit 1
          fi
          echo "Downloaded $count package archives from CI run ${{ steps.ci.outputs.run_id }}."

      - name: Install prebuilt PSP toolchain
        run: |
          export PSPDEV=/opt/pspdev
          archive="$RUNNER_TEMP/psp-toolchain-ubuntu-x86_64.tar.gz"

          sudo rm -rf "$PSPDEV"
          wget -q \
            https://github.com/StochasticEagle/psp-toolchain/releases/latest/download/psp-toolchain-ubuntu-x86_64.tar.gz \
            -O "$archive"
          sudo tar -xzf "$archive" -C /opt
          sudo chown -R "$(id -u):$(id -g)" "$PSPDEV"

          echo "PSPDEV=$PSPDEV" >> "$GITHUB_ENV"
          echo "$PSPDEV/bin" >> "$GITHUB_PATH"
          test -x "$PSPDEV/share/pacman/bin/repo-add"

      - name: Create Pacman repository
        run: |
          rm -rf repo
          mkdir -p repo
          cp packages/*.pkg.tar.* repo/
          ./make-repo-html.sh

          cd repo
          "$PSPDEV/share/pacman/bin/repo-add" pspdev.db.tar.gz *.pkg.tar.*
          mv pspdev.db.tar.gz pspdev.db
          mv pspdev.files.tar.gz pspdev.files

          test -s pspdev.db
          test -s pspdev.files
          compgen -G '*.pkg.tar.*' >/dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./repo

      - name: Deploy Pacman repository
        id: deployment
        uses: actions/deploy-pages@v5
