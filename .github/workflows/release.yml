name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: psp-packages-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Validate source-component invariants
        run: python3 scripts/check-source-components.py

      - name: Audit package recipes
        run: python3 scripts/check-package-recipes.py

      - name: Validate host build dependencies
        run: python3 scripts/check-host-dependencies.py

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint bison build-essential cmake fakeroot flex gawk gettext \
            git libarchive-dev libarchive-tools libcurl4-openssl-dev libgmp-dev \
            libgpgme-dev libgsl-dev libmpc-dev libmpfr-dev libreadline-dev \
            libssl-dev libtool libtool-bin libusb-dev meson ninja-build patch pkg-config \
            python3 python3-jinja2 python3-jsonschema texinfo wget xz-utils zlib1g-dev

      - name: Verify host build tools
        run: |
          for tool in \
            autoconf autoheader automake aclocal autoreconf autopoint \
            libtool libtoolize gettext pkg-config \
            cmake meson ninja patch make python3; do
            command -v "$tool" >/dev/null || {
              echo "ERROR: required host build tool is unavailable: $tool"
              exit 1
            }
          done

      - name: Install prebuilt PSP toolchain
        run: |
          export PSPDEV=/opt/pspdev
          archive="$RUNNER_TEMP/psp-toolchain-ubuntu-x86_64.tar.gz"

          sudo rm -rf "$PSPDEV"
          wget -q \
            https://github.com/StochasticEagle/psp-toolchain/releases/latest/download/psp-toolchain-ubuntu-x86_64.tar.gz \
            -O "$archive"
          sudo tar -xzf "$archive" -C /opt
          sudo chown -R "$(id -u):$(id -g)" "$PSPDEV"

          export PATH="$PSPDEV/bin:$PATH"
          echo "PSPDEV=$PSPDEV" >> "$GITHUB_ENV"
          echo "$PSPDEV/bin" >> "$GITHUB_PATH"
          test "$(psp-gcc -dumpmachine)" = "psp"

      - name: Install prebuilt PSPSDK
        run: |
          export PSPDEV=/opt/pspdev
          archive="$RUNNER_TEMP/pspsdk-ubuntu-x86_64.tar.gz"

          wget -q \
            https://github.com/StochasticEagle/pspsdk/releases/latest/download/pspsdk-ubuntu-x86_64.tar.gz \
            -O "$archive"
          sudo tar -xzf "$archive" -C /opt
          sudo chown -R "$(id -u):$(id -g)" "$PSPDEV"

          export PATH="$PSPDEV/bin:$PATH"
          test "$(psp-config --pspsdk-path)" = "$PSPDEV/psp/sdk"
          test -f "$PSPDEV/psp/sdk/lib/libpspsdk.a"
          test -f "$PSPDEV/psp/sdk/lib/build.mak"

      - name: Build packages
        run: |
          export PATH="$PSPDEV/bin:$PATH"

          build_log="$RUNNER_TEMP/psp-packages-build.log"
          set +e
          set -o pipefail
          ./build.sh 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set +o pipefail
          set -e

          drift="$(
            grep -E 'with fuzz|offset -?[0-9]+ lines?' "$build_log" || true
          )"
          if [[ -n "$drift" ]]; then
            echo "::warning::Patch drift detected during package builds; refresh affected patches."
            printf '%s\n' "$drift"
          fi

          exit "$build_status"

      - name: Verify complete package output
        run: python3 scripts/verify-package-output.py

      - name: Create Pacman repository
        run: |
          rm -rf repo
          mkdir -p repo
          cp packages/*.pkg.tar.* repo/
          ./make-repo-html.sh

          cd repo
          "$PSPDEV/share/pacman/bin/repo-add" pspdev.db.tar.gz *.pkg.tar.*
          mv pspdev.db.tar.gz pspdev.db
          mv pspdev.files.tar.gz pspdev.files

          test -s pspdev.db
          test -s pspdev.files
          compgen -G '*.pkg.tar.*' >/dev/null

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./repo

      - name: Deploy Pacman repository
        id: deployment
        uses: actions/deploy-pages@v5
