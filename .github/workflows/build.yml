name: Packages

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  prepare_jobs:
    runs-on: ubuntu-latest
    container: python:3-alpine
    steps:
      - uses: actions/checkout@v6
      - name: Generate build list
        id: set-matrix
        run: |
          echo "build_list=$(./get_build_order.py)" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT
    outputs:
      build_list: ${{ steps.set-matrix.outputs.build_list }}

  build:
    needs: [prepare_jobs]
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspsdk:latest
    strategy:
      fail-fast: false
      matrix:
        packages: ${{ fromJson(needs.prepare_jobs.outputs.build_list) }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Build packages
      run: |
        adduser -D -h /build -s /bin/bash build
        mkdir -p build
        chown -R build:build /build ${PSPDEV} build
        for f in ${{ matrix.packages }}; do
          sudo -u build PATH=${PATH} PSPDEV=${PSPDEV} LIBMAKEPKG_LINT_PACKAGE_DOTFILES_SH=0 ./build.sh --install "$f"
        done
    - name: Store package
      run: |
        PACKAGE=`echo ${{ matrix.packages }} | awk '{print $NF}'`
        PKGFILE=`./parse_pspbuild.sh "pspbuild/${PACKAGE}/PSPBUILD" pkgoutput`
        echo "PACKAGE=$PACKAGE" >> $GITHUB_ENV
        echo "PKGFILE=$PKGFILE" >> $GITHUB_ENV
    - uses: actions/upload-artifact@v7
      with:
        name: artifact-${{ env.PACKAGE }}
        path: build/${{ env.PKGFILE }}

  package_repo:
    if: contains(github.ref,'refs/heads/master')
    needs: [prepare_jobs, build]
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspsdk:latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Download artifacts
      uses: actions/download-artifact@v8
    - name: Create repo files
      run: |
        chown -R $(id -nu):$(id -ng) .
        apk add --no-cache bash coreutils
        mkdir repo
        cp artifact-*/*.pkg.tar.gz repo/
        ./make-repo-html.sh
        cd repo
        ${PSPDEV}/share/pacman/bin/repo-add pspdev.db.tar.gz *.pkg.tar.gz
        mv pspdev.db.tar.gz pspdev.db
        mv pspdev.files.tar.gz pspdev.files
        tar -cvf ../repo.tar ./*
    - name: Upload repo artifact
      uses: actions/upload-artifact@v7
      with:
        name: github-pages
        path: repo.tar

  publish_repo:
    if: contains(github.ref,'refs/heads/master')
    needs: [package_repo]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  docker-layer:
    if: contains(github.ref,'refs/heads/master')
    needs: [publish_repo]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Github registry
      uses: docker/login-action@v4
      with:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ghcr.io

    - uses: docker/build-push-action@v7
      with:
        push: true
        tags: ghcr.io/${{ github.repository }}:latest
        build-args: |
          BASE_DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/pspsdk:latest

    - name: Send Compile action
      run: |
        export DISPATCH_ACTION="$(echo run_build)"
        echo "NEW_DISPATCH_ACTION=$DISPATCH_ACTION" >> $GITHUB_ENV
    - name: Repository Dispatch to pspdev
      uses: peter-evans/repository-dispatch@v4
      with:
        repository: ${{ github.repository_owner }}/pspdev
        token: ${{ secrets.DISPATCH_TOKEN }}
        event-type: ${{ env.NEW_DISPATCH_ACTION }}
        client-payload: '{"ref": "refs/heads/master"}'
