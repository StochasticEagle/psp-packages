name: Packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Validate source-component invariants
        run: python3 scripts/check-source-components.py

  build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential cmake fakeroot flex gawk gettext \
            git libarchive-dev libarchive-tools libcurl4-openssl-dev libgmp-dev \
            libgpgme-dev libgsl-dev libmpc-dev libmpfr-dev libreadline-dev \
            libssl-dev libtool libusb-dev meson ninja-build patch pkg-config \
            python3-jinja2 python3-jsonschema texinfo wget xz-utils zlib1g-dev

      - name: Build forked PSP toolchain
        run: |
          export PSPDEV="$RUNNER_TEMP/pspdev"
          export PATH="$PSPDEV/bin:$PATH"
          echo "PSPDEV=$PSPDEV" >> "$GITHUB_ENV"
          echo "$PSPDEV/bin" >> "$GITHUB_PATH"

          git clone --depth 1 --branch dev/fork \
            --recurse-submodules --shallow-submodules \
            https://github.com/StochasticEagle/psp-toolchain.git \
            "$RUNNER_TEMP/psp-toolchain"

          "$RUNNER_TEMP/psp-toolchain/toolchain.sh"

      - name: Build forked PSPSDK
        run: |
          export PATH="$PSPDEV/bin:$PATH"

          git clone --depth 1 --branch dev/fork \
            --recurse-submodules --shallow-submodules \
            https://github.com/StochasticEagle/pspsdk.git \
            "$RUNNER_TEMP/pspsdk"

          # Package builds need the core SDK only. The CFW additions depend on
          # PSP packages such as zlib/libpng and are built later by PSPDEV,
          # after the package set has been installed.
          "$RUNNER_TEMP/pspsdk/build-and-install.sh"

      - name: Build packages
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          ./build.sh

      - name: Verify package output
        run: |
          shopt -s nullglob
          packages=(packages/*.pkg.tar.*)
          if (( ${#packages[@]} == 0 )); then
            echo "ERROR: no package archives were produced"
            exit 1
          fi
          printf 'Built %s package archives.\n' "${#packages[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/*.pkg.tar.*
          if-no-files-found: error

      - name: Create pacman repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/fork'
        run: |
          mkdir -p repo
          cp packages/*.pkg.tar.* repo/
          ./make-repo-html.sh
          cd repo
          "$PSPDEV/share/pacman/bin/repo-add" pspdev.db.tar.gz *.pkg.tar.*
          mv pspdev.db.tar.gz pspdev.db
          mv pspdev.files.tar.gz pspdev.files
          tar -cvf ../repo.tar ./*

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/fork'
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: repo.tar
          if-no-files-found: error

  publish-repo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/fork'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
