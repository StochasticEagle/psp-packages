name: Packages

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    container: python:3-alpine

    steps:
      - name: Install validation tools
        shell: sh
        run: apk add --no-cache git bash

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Validate repository structure
        shell: sh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import configparser
          import pathlib
          import re
          import subprocess
          import sys

          root = pathlib.Path(".")
          errors = []

          modules = configparser.ConfigParser()
          modules.read(root / ".gitmodules")

          declared = {}
          for section in modules.sections():
              if not section.startswith('submodule "'):
                  continue

              path = modules[section].get("path", "").strip()
              url = modules[section].get("url", "").strip()
              shallow = modules[section].get("shallow", "").strip().lower()

              if not path:
                  errors.append(f"{section}: missing path")
                  continue
              if path in declared:
                  errors.append(f"duplicate submodule path: {path}")
              declared[path] = url

              if not path.startswith("components/"):
                  errors.append(f"{section}: path is outside components/: {path}")
              if not url:
                  errors.append(f"{section}: missing URL")
              if shallow != "true":
                  errors.append(f"{section}: shallow must be true")

          gitlinks = {}
          listing = subprocess.check_output(
              ["git", "ls-files", "--stage"], text=True
          )
          for line in listing.splitlines():
              parts = line.split(None, 3)
              if len(parts) == 4 and parts[0] == "160000":
                  gitlinks[parts[3]] = parts[1]

          declared_paths = set(declared)
          gitlink_paths = set(gitlinks)

          for path in sorted(declared_paths - gitlink_paths):
              errors.append(f"submodule is not recorded as a gitlink: {path}")
          for path in sorted(gitlink_paths - declared_paths):
              errors.append(f"gitlink is missing from .gitmodules: {path}")

          source_map = root / "source-components.tsv"
          source_components = {}
          if source_map.exists():
              seen_urls = set()
              for lineno, raw in enumerate(source_map.read_text().splitlines(), 1):
                  if not raw.strip():
                      continue
                  try:
                      url, path = raw.split("\t", 1)
                  except ValueError:
                      errors.append(
                          f"source-components.tsv:{lineno}: expected URL<TAB>component"
                      )
                      continue

                  if url in seen_urls:
                      errors.append(
                          f"source-components.tsv:{lineno}: duplicate URL: {url}"
                      )
                  seen_urls.add(url)
                  source_components[url] = path

                  if path not in gitlink_paths:
                      errors.append(
                          f"source-components.tsv:{lineno}: component is not a gitlink: {path}"
                      )

          mapping_re = re.compile(
              r'psp_source_components\s*=\((.*?)\)',
              re.DOTALL,
          )
          component_re = re.compile(r'components/[A-Za-z0-9_.+-]+')

          recipes = sorted((root / "pspbuild").glob("*/PSPBUILD"))

          for recipe in recipes:
              text = recipe.read_text()
              for block in mapping_re.findall(text):
                  for path in component_re.findall(block):
                      if path not in gitlink_paths:
                          errors.append(
                              f"{recipe}: mapped component is not a gitlink: {path}"
                          )

          git_source_count = 0

          for recipe in recipes:
              probe = subprocess.run(
                  [
                      "bash",
                      "-c",
                      r'''
          source "$1"
          
          if ! declare -p source >/dev/null 2>&1; then
              exit 0
          fi
          
          for i in "${!source[@]}"; do
              src="${source[$i]}"
          
              case "$src" in
                  *git+*)
                      mapped=""
          
                      if declare -p psp_source_components >/dev/null 2>&1; then
                          mapped="${psp_source_components[$i]-}"
                      fi
          
                      printf '%s\t%s\t%s\n' "$i" "$mapped" "$src"
                      ;;
              esac
          done
          ''',
                      "_",
                      str(recipe),
                  ],
                  text=True,
                  capture_output=True,
              )

              if probe.returncode != 0:
                  detail = probe.stderr.strip() or f"exit status {probe.returncode}"
                  errors.append(
                      f"{recipe}: could not evaluate Git sources: {detail}"
                  )
                  continue

              for raw in probe.stdout.splitlines():
                  try:
                      source_index, mapped, src = raw.split("\t", 2)
                  except ValueError:
                      errors.append(
                          f"{recipe}: malformed Git-source validation output: {raw}"
                      )
                      continue

                  git_source_count += 1

                  entry = src.split("::", 1)[1] if "::" in src else src
                  if not entry.startswith("git+"):
                      errors.append(
                          f"{recipe}: source[{source_index}] contains git+ "
                          f"but cannot be parsed: {src}"
                      )
                      continue

                  remote = entry[len("git+"):]
                  remote = remote.split("#", 1)[0]

                  if mapped:
                      component = mapped
                  else:
                      component = source_components.get(remote, "")
                      if not component:
                          source_name = pathlib.PurePosixPath(
                              remote.rstrip("/")
                          ).name
                          if source_name.endswith(".git"):
                              source_name = source_name[:-4]
                          component = f"components/{source_name}"

                  if not component.startswith("components/"):
                      errors.append(
                          f"{recipe}: source[{source_index}] maps outside "
                          f"components/: {component}"
                      )
                      continue

                  if component not in gitlink_paths:
                      errors.append(
                          f"{recipe}: Git source[{source_index}] does not "
                          f"resolve to a component gitlink: "
                          f"{remote} -> {component}"
                      )

          if errors:
              print("Repository structure validation failed:", file=sys.stderr)
              for error in errors:
                  print(f"  - {error}", file=sys.stderr)
              raise SystemExit(1)

          print(
              f"Validated {len(gitlink_paths)} shallow component gitlinks, "
              f"{len(recipes)} package recipes, "
              f"and {git_source_count} Git-backed recipe sources."
          )
          PY

  build:
    needs: validate
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspsdk:latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Build packages
        shell: sh
        run: |
          apk add --no-cache meson ninja coreutils grep tar
          adduser -D -h /build -s /bin/bash build
          mkdir -p build packages
          chown -R build:build /build "${PSPDEV}" .
          sudo -u build PATH="${PATH}" PSPDEV="${PSPDEV}" \
            LIBMAKEPKG_LINT_PACKAGE_DOTFILES_SH=0 ./build.sh

      - name: Verify package output
        shell: sh
        run: |
          set -- packages/*.pkg.tar.gz
          if [ ! -e "$1" ]; then
            echo "ERROR: no package archives were produced"
            exit 1
          fi
          printf 'Built %s package archives.\n' "$#"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/*.pkg.tar.gz
          if-no-files-found: error

  package_repo:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspsdk:latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Create repo files
        shell: sh
        run: |
          chown -R "$(id -nu):$(id -ng)" .
          apk add --no-cache bash coreutils
          mkdir repo
          cp packages/*.pkg.tar.gz repo/
          ./make-repo-html.sh
          cd repo
          "${PSPDEV}/share/pacman/bin/repo-add" pspdev.db.tar.gz *.pkg.tar.gz
          mv pspdev.db.tar.gz pspdev.db
          mv pspdev.files.tar.gz pspdev.files
          tar -cvf ../repo.tar ./*

      - name: Upload repo artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: repo.tar

  publish_repo:
    if: github.ref == 'refs/heads/master'
    needs: package_repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  docker-layer:
    if: github.ref == 'refs/heads/master'
    needs: publish_repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Github registry
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            BASE_DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/pspsdk:latest

      - name: Repository Dispatch to pspdev
        uses: peter-evans/repository-dispatch@v4
        with:
          repository: ${{ github.repository_owner }}/pspdev
          token: ${{ secrets.DISPATCH_TOKEN }}
          event-type: run_build
          client-payload: '{"ref": "refs/heads/master"}'
