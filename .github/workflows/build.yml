name: Packages

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    container: python:3-alpine

    steps:
      - name: Install validation tools
        shell: sh
        run: apk add --no-cache git bash

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Validate source-component invariants
        shell: sh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/check-source-components.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspsdk:latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Build packages
        shell: sh
        run: |
          apk add --no-cache meson ninja coreutils grep tar
          adduser -D -h /build -s /bin/bash build
          mkdir -p build packages
          chown -R build:build /build "${PSPDEV}" .
          sudo -u build PATH="${PATH}" PSPDEV="${PSPDEV}" \
            LIBMAKEPKG_LINT_PACKAGE_DOTFILES_SH=0 ./build.sh

      - name: Verify package output
        shell: sh
        run: |
          set -- packages/*.pkg.tar.gz
          if [ ! -e "$1" ]; then
            echo "ERROR: no package archives were produced"
            exit 1
          fi
          printf 'Built %s package archives.\n' "$#"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/*.pkg.tar.gz
          if-no-files-found: error

  package_repo:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspsdk:latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Create repo files
        shell: sh
        run: |
          chown -R "$(id -nu):$(id -ng)" .
          apk add --no-cache bash coreutils
          mkdir repo
          cp packages/*.pkg.tar.gz repo/
          ./make-repo-html.sh
          cd repo
          "${PSPDEV}/share/pacman/bin/repo-add" pspdev.db.tar.gz *.pkg.tar.gz
          mv pspdev.db.tar.gz pspdev.db
          mv pspdev.files.tar.gz pspdev.files
          tar -cvf ../repo.tar ./*

      - name: Upload repo artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: repo.tar

  publish_repo:
    if: github.ref == 'refs/heads/master'
    needs: package_repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  docker-layer:
    if: github.ref == 'refs/heads/master'
    needs: publish_repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Github registry
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            BASE_DOCKER_IMAGE=ghcr.io/${{ github.repository_owner }}/pspsdk:latest

      - name: Repository Dispatch to pspdev
        uses: peter-evans/repository-dispatch@v4
        with:
          repository: ${{ github.repository_owner }}/pspdev
          token: ${{ secrets.DISPATCH_TOKEN }}
          event-type: run_build
          client-payload: '{"ref": "refs/heads/master"}'
